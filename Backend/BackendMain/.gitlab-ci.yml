stages:
  - mavenbuild
  - maventest

maven-build:
  stage: mavenbuild
  tags:
    - jj_tag
  script:
    - cd Backend/BackendMain/springboot_example
    - mvn package
  only:
    refs:
      - JJ_CICD
    changes:
      - Backend/**/*

maven-test:
  stage: maventest
  tags:
    - jj_tag
  script:
    - cd Backend/BackendMain/springboot_example
    - mvn test
  only:
    refs:
      - JJ_CICD
    changes:
      - Backend/**/*